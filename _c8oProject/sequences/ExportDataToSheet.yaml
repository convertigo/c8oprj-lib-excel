↓write_xlsx [steps.SimpleStep-1718724633223]: 
  expression: |
    'include(''SheetJS/Shim.js'');
    include(''SheetJS/SheetJS.js'');
    
    /*
    var data = [
        {"name":"John", "city": "Seattle"},
        {"name":"Mike", "city": "Los Angeles"},
        {"name":"Zach", "city": "New York"}
    ];
    */
    
    is_success = true;
    error_msg = "";
    book_type = (book_type != null) && book_type != "" ? book_type : "xlsx";
    ext = book_types[book_type] != null && book_types[book_type] != "" ? book_types[book_type]["extension"] : ".xlsx";
    file_name = (file_name != null) && file_name != "" ? file_name : "output" + ext;
    var output_file = (context.getProjectDirectory()).replace("\\", "/") + "/" + file_name;
    var url_file = context.getProjectUrl() + file_name;
    
    try {
    	/* make the worksheet */
    	var ws = XLSX.utils.json_to_sheet(jsonVar);
    	
    	/* add to workbook */
    	var wb = XLSX.utils.book_new();
    	sheet_name = (sheet_name != null) && sheet_name != "" ? sheet_name : "Sheet";
    	XLSX.utils.book_append_sheet(wb, ws, sheet_name);
    	
    	/* generate an XLSX file */
    	var output = XLSX.write(wb, {bookType: book_type, type: "base64"});
    	ba = com.twinsoft.convertigo.engine.util.Base64.decode(output);
    	org.apache.commons.io.FileUtils.writeByteArrayToFile(new java.io.File(output_file), ba);
    } catch(e){
    	is_success = false;
    	error_msg = ""+e;
    	log.warn(""+e);
    }'
