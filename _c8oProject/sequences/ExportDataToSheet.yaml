↓write_xlsx [steps.SimpleStep-1718724633223]: 
  expression: |
    'include(''SheetJS/Shim.js'');
    include(''SheetJS/SheetJS.js'');
    is_success = false;
    error_msg = "";
    local_path_value = null;
    book_type = (book_type != null && String(book_type) != "") ? String(book_type) : "xlsx";
    var book_definition = book_types[book_type];
    var ext = book_definition != null ? book_definition["extension"] : ".xlsx";
    var requested_name = (file_name != null && String(file_name) != "") ? String(file_name) : "output" + ext;
    var valid_name = /^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(requested_name)
      && requested_name.indexOf("..") == -1
      && requested_name.slice(-ext.length).toLowerCase() == ext.toLowerCase();
    file_name = java.util.UUID.randomUUID().toString() + "-" + (valid_name ? requested_name : "output" + ext);
    sheet_name = (sheet_name != null && String(sheet_name) != "") ? String(sheet_name) : "Sheet";
    var output_dir = new java.io.File(context.getProjectDirectory(), "outputs");
    var output_file = new java.io.File(output_dir, file_name).getCanonicalPath();
    var url_file = context.getConvertigoUrl() + "projects/" + context.getProjectName() + "/outputs/" + file_name;
    // An HTTP client only gets the URL of the file: its path on the server is kept for internal callers.
    var internal_call = false;
    try {
        internal_call = context.requestedObject.getRequester().isInternal() == true;
    } catch (e) {
        internal_call = false;
    }
    // Size of the export, bounded by the symbol lib_MicrosoftExcel.maxExportCells (cells of all the rows).
    var max_cells = parseInt("" + com.twinsoft.convertigo.engine.Engine.theApp.databaseObjectsManager
        .getCompiledValue("$" + "{lib_MicrosoftExcel.maxExportCells=2000000}"), 10);
    if (isNaN(max_cells) || max_cells < 1) {
        max_cells = 2000000;
    }
    var cells = 0;
    // header (optional): the order of the columns of the sheet, a JSON array of their names (keys of the rows), written first.
    // Without it the columns follow the keys of the first rows, where a name made of digits ("2024") comes first.
    var header_list = null;
    var header_error = "";
    if (typeof header != "undefined" && header != null && String(header) != "") {
        try {
            header_list = JSON.parse(String(header));
        } catch (e) {
            header_list = null;
        }
        if (!Array.isArray(header_list) || header_list.length > 16384) {
            header_list = null;
            header_error = "Invalid header";
        } else {
            for (var headerIndex = 0; headerIndex < header_list.length; headerIndex++) {
                if (header_list[headerIndex] == null || typeof header_list[headerIndex] == "object") {
                    header_list = null;
                    header_error = "Invalid header";
                    break;
                }
                header_list[headerIndex] = String(header_list[headerIndex]);
            }
        }
    }
    if (!valid_name || !output_file.startsWith(output_dir.getCanonicalPath() + java.io.File.separator)) {
        error_msg = "Invalid output file name";
    } else if (data_error != "") {
        error_msg = data_error;
    } else if (typeof jsonVar == "undefined" || jsonVar == null) {
        error_msg = "No data provided";
    } else if (!Array.isArray(jsonVar)) {
        error_msg = "Data must be an array of objects";
    } else if (book_definition == null || book_type == "html") {
        error_msg = "Unsupported book type: " + book_type;
    } else if (header_error != "") {
        error_msg = header_error;
    } else {
        // the names of the header are cells of the sheet too
        cells = header_list != null ? header_list.length : 0;
        for (var rowIndex = 0; rowIndex < jsonVar.length; rowIndex++) {
            if (jsonVar[rowIndex] == null || typeof jsonVar[rowIndex] != "object" || Array.isArray(jsonVar[rowIndex])) {
                error_msg = "Data must be an array of objects";
                break;
            }
            cells += Object.keys(jsonVar[rowIndex]).length;
        }
        if (error_msg == "" && cells > max_cells) {
            error_msg = "Too much data to export: " + cells + " cells, at most " + max_cells + " (symbol lib_MicrosoftExcel.maxExportCells)";
        }
    }
    if (error_msg == "") {
        try {
    //        var ws = XLSX.utils.json_to_sheet(jsonVar);
    //        var wb = XLSX.utils.book_new();
    //        XLSX.utils.book_append_sheet(wb, ws, sheet_name);
    //        var output = XLSX.write(wb, {bookType: book_type, type: "base64"});
    //        var ba = com.twinsoft.convertigo.engine.util.Base64.decode(output);
    //        org.apache.commons.io.FileUtils.writeByteArrayToFile(new java.io.File(output_file), ba);
    //        is_success = true;
    		var ws = header_list != null ? XLSX.utils.json_to_sheet(jsonVar, {header: header_list}) : XLSX.utils.json_to_sheet(jsonVar);
    		var wb = XLSX.utils.book_new();
    		XLSX.utils.book_append_sheet(wb, ws, sheet_name);
    		
    		var output = XLSX.write(wb, {
    			bookType: book_type,
    			type: "base64"
    		});
    
    		var ba = com.twinsoft.convertigo.engine.util.Base64.decode(output);
    
    		org.apache.commons.io.FileUtils.writeByteArrayToFile(
    			new java.io.File(output_file),
    			ba
    		);
    		
    //		context.addFileToDeleteAtEndOfSession(
    //			new java.io.File(output_file)
    //		);
    		
    		context.addFileToDeleteAtEndOfSession(
    			new java.io.File(output_file)
    		);
    		
    		local_path_value = internal_call ? output_file : null;
    		is_success = true;
        } catch (e) {
            error_msg = "Can not export data";
            log.warn("ExportDataToSheet: " + e);
        }
    }'
