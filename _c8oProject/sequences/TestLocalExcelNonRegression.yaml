↓AssertResults [steps.SimpleStep-1785327956427]: 
  expression: |
    'function fieldText(row, fieldName) {
    	var nodes = row.getElementsByTagName(fieldName);
    	return nodes.getLength() > 0 ? String(nodes.item(0).getTextContent()) : null;
    }
    
    var failures = [];
    var sampleCount = sampleRows.getLength();
    var typesCount = typesRows.getLength();
    var roundTripCount = roundTripRows.getLength();
    
    if (sampleCount != 50) {
    	failures.push("sample row count expected 50, got " + sampleCount);
    }
    
    if (typesCount != 2) {
    	failures.push("typed fixture row count expected 2, got " + typesCount);
    } else {
    	if (fieldText(typesRows.item(0), "name") != "Alice") failures.push("typed fixture first name");
    	if (fieldText(typesRows.item(0), "city") != "Rome") failures.push("typed fixture first city");
    	if (fieldText(typesRows.item(0), "score") != "42") failures.push("typed fixture numeric score");
    }
    
    if (String(exportSuccess) != "true") {
    	failures.push("round-trip export did not report success");
    }
    
    if (roundTripCount != 2) {
    	failures.push("round-trip row count expected 2, got " + roundTripCount);
    } else {
    	if (fieldText(roundTripRows.item(1), "name") != "Bob") failures.push("round-trip second name");
    	if (fieldText(roundTripRows.item(1), "score") != "17") failures.push("round-trip second numeric score");
    }
    
    if (failures.length > 0) {
    	throw new Error("Local Excel non-regression failed: " + failures.join("; "));
    }
    
    regressionResult = {
    	status: "ok",
    	total: 4,
    	tests: [
    		{name: "read_50_row_fixture", status: "ok", rows: sampleCount},
    		{name: "read_typed_fixture", status: "ok", rows: typesCount},
    		{name: "export_xlsx", status: "ok"},
    		{name: "round_trip_xlsx", status: "ok", rows: roundTripCount}
    	]
    };'
