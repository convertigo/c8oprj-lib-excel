      var lowerFileName = ("" + fileName).toLowerCase();
      
      if (lowerFileName == ".gitkeep") {
      	isFileRemovable = false;
      } else {
      	if (!/\.(xlsx|xlsm|xlsb|xls|numbers|ods|fods|wk3|csv|txt|sylk|html|dif|dbf|wk1|rtf|prn|eth)$/i.test(lowerFileName)) {
