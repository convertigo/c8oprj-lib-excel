accessibility: Hidden
comment: Imports an xlsx file ( from "itemPath") and outputs a JSON object of the "name" Sheet by the range of "range". Uses the SheetJS CE framework. The optional "options" variable is passed to the SheetJS sheet_to_json call (as a JSON object or a JSON string), for example {"defval":""} to fill empty cells with a default value so every row has the same columns.
↓read_xlsx [steps.SimpleStep-1708681393921]: 
  comment: Reads the worksheet with SheetJS and applies the sequence variable "options" (JSON object or JSON string) to sheet_to_json, on top of the decoded "range".
  expression: |
    'include(''SheetJS/Shim.js'');
    include(''SheetJS/SheetJS.js'');
    error = false;
    err_msg = "";
    err_code = "-1";
    raw_data = [];
    
    // Parse une option (objet JS ou chaîne JSON) en objet. Retourne null si invalide.
    function parseOptions(value) {
        if (value == null || String(value) == "") {
            return {};
        }
        var isString = typeof value == "string" || Object.prototype.toString.call(value) == "[object String]";
        if (isString) {
            try {
                var parsed = JSON.parse(String(value));
                return (parsed != null && typeof parsed == "object") ? parsed : null;
            } catch (e) {
                return null;
            }
        }
        return (typeof value == "object") ? value : null;
    }
    
    if (itemPath == null || String(itemPath) == "") {
        error = true;
        err_msg = "No file provided";
        err_code = "-1";
    } else {
        try {
            var file = new java.io.File(String(itemPath));
            if (!file.isFile()) {
                error = true;
                err_msg = "File not found or not readable";
                err_code = "-2";
            }
    
            // Options pour XLSX.read
            var xlsxReadOptions = {};
            if (!error) {
                var rOpts = parseOptions(typeof xlsx_read_options != "undefined" ? xlsx_read_options : null);
                if (rOpts == null) {
                    error = true;
                    err_msg = "Invalid xlsx_read_options: must be a JSON object or a JSON string";
                    err_code = "-7";
                } else {
                    for (var rKey in rOpts) {
                        xlsxReadOptions[rKey] = rOpts[rKey];
                    }
                    // Le type est imposé : les données sont fournies en base64
                    xlsxReadOptions.type = "base64";
                }
            }
    		
            if (!error) {
                var baData = org.apache.commons.io.FileUtils.readFileToByteArray(file);
                var b64 = "" + com.twinsoft.convertigo.engine.util.Base64.encodeBytes(baData);
                var workbook = XLSX.read(b64, xlsxReadOptions);
                var sheet_name;
                if (name != null) {
                    if (String(name) != "") {
                        sheet_name = String(name);
                    } else {
                        error = true;
                        err_msg = "Sheet name can not be empty";
                        err_code = "-3";
                    }
                } else {
                    sheet_name = workbook.SheetNames[0];
                }
                if (!error) {
                    var worksheet = workbook.Sheets[sheet_name];
                    if (worksheet == null) {
                        error = true;
                        err_msg = "No Sheet named ''" + sheet_name + "'' found";
                        err_code = "-4";
                    } else {
                        var opts = {};
                        if (range != null && String(range) != "") {
                            var rangeText = String(range);
                            if (!/^[A-Za-z]+[1-9][0-9]*(?::[A-Za-z]+[1-9][0-9]*)?$/.test(rangeText)) {
                                error = true;
                                err_msg = "Invalid cell range";
                                err_code = "-5";
                            } else {
                                opts.range = XLSX.utils.decode_range(rangeText);
                            }
                        } else {
                            opts.range = worksheet[''!ref''];
                        }
                        if (!error) {
                            // Options pour sheet_to_json
                            var read_options = parseOptions(options);
                            if (read_options == null) {
                                error = true;
                                err_msg = "Invalid options: must be a JSON object or a JSON string";
                                err_code = "-6";
                            } else {
                                for (var optKey in read_options) {
                                    opts[optKey] = read_options[optKey];
                                }
                                raw_data = XLSX.utils.sheet_to_json(worksheet, opts);
                            }
                        }
                    }
                }
            }
        } catch (e) {
            error = true;
            err_msg = "Can not read file";
            err_code = "-2";
            log.warn("SheetGetRangeFile: " + e);
        }
    }'
